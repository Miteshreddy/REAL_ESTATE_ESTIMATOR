# Render Blueprint — PWD Estimator (one Docker web service: app + in-app Meta Llama 3.2 3B + private SearXNG)
# Memory: the app with its vision models uses ~1.5 GB and Llama 3.2 3B ~2.3 GB, so a 4 GB plan ("pro") is needed.
# To run on a smaller plan, set LLM_BACKEND=none (written summaries off; everything else works).
services:
  - type: web
    name: pwd-estimator
    runtime: docker
    region: singapore
    plan: pro
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/scope-options
    autoDeploy: true
    disk:
      name: pwd-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: EST_DATA_DIR
        value: /var/data
      - key: SEARXNG_URL
        value: http://127.0.0.1:8888
      - key: SEARXNG_SECRET
        generateValue: true
      - key: LLM_BACKEND
        value: llamacpp
      - key: EST_DETECTOR_MODEL
        value: opening_det_v8m.onnx
